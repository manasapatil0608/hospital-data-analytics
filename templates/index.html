<!DOCTYPE html>
<html>
<head>
    <title>Hospital Data Uploader</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
        }

        .container {
            width: 500px;
            margin: auto;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            margin-top: 25px;
            padding: 12px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Hospital Data Uploader</h1>

    <form action="/upload" method="POST" enctype="multipart/form-data">

        <label>Select Excel or CSV file:</label>

        <input
            type="file"
            name="file"
            accept=".csv,.xlsx,.xls"
            required
        >

        <label>Enter SQL Server table name:</label>

        <input
            type="text"
            name="table_name"
            placeholder="Example: patients"
            required
        >

        <button type="submit">
            Upload to SQL Server
        </button>

    </form>

</div>

</body>
</html>
